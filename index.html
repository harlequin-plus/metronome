<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Метроном</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    background: #1a1a1a;
    border-radius: 28px;
    padding: 20px 24px 16px;
    width: 100%;
    max-width: 400px;
    height: min(100dvh - 16px, 740px);
    box-shadow: 0 25px 50px -12px rgba(0,0,0,.8);
    display: flex;
    flex-direction: column;
  }

  .bpm-display {
    text-align: center;
  }

  .bpm-value {
    font-size: 76px;
    font-weight: 700;
    letter-spacing: -2px;
    color: #fff;
    line-height: 1;
    transition: color .15s;
  }

  .bpm-value.running { color: #22c55e; }

  .bpm-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: #666;
    margin-top: 2px;
  }

  .bpm-slider-wrap {
    margin: 6px 0 14px;
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: #333;
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #22c55e;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }

  input[type=range]::-webkit-slider-thumb:active {
    transform: scale(.95);
    box-shadow: 0 0 0 8px rgba(34,197,94,.2);
  }

  input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #22c55e;
    border: none;
    cursor: pointer;
  }

  .bpm-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 14px;
  }

  .bpm-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid #333;
    background: transparent;
    color: #e0e0e0;
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bpm-btn:active { background: #222; }

  .sounds-selector {
    margin-top: 10px;
    margin-bottom: 14px;
  }

  .sounds-selector label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #666;
    margin-bottom: 4px;
  }

  .sounds-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }

  .sound-option {
    flex: 1 0 calc(33.33% - 3px);
    padding: 6px 0;
    border-radius: 8px;
    border: 1px solid #333;
    background: transparent;
    color: #666;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }

  .sound-option:active { background: #222; }

  .sound-option.active {
    border-color: #a855f7;
    background: #a855f7;
    color: #000;
  }

  .accent-row {
    margin-top: 8px;
    margin-bottom: 14px;
  }

  .accent-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }

  .accent-toggle input { display: none; }

  .accent-slider {
    position: relative;
    width: 34px;
    height: 20px;
    background: #333;
    border-radius: 10px;
    transition: background .2s;
    flex-shrink: 0;
  }

  .accent-slider::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #666;
    transition: all .2s;
  }

  .accent-toggle input:checked + .accent-slider { background: #a855f7; }
  .accent-toggle input:checked + .accent-slider::after { left: 17px; background: #fff; }

  .accent-label {
    font-size: 11px;
    color: #888;
  }

  .controls {
    margin-bottom: 14px;
  }

  .beats-selector label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #666;
    margin-bottom: 4px;
  }

  .beats-grid {
    display: flex;
    gap: 3px;
  }

  .beat-option {
    flex: 1;
    aspect-ratio: 1;
    border-radius: 10px;
    border: 1px solid #333;
    background: transparent;
    color: #666;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .beat-option:active { background: #222; }

  .beat-option.active {
    border-color: #22c55e;
    background: #22c55e;
    color: #000;
  }

  .start-btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: none;
    background: #22c55e;
    color: #000;
    font-size: 30px;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .start-btn:active { transform: scale(.94); }
  .start-btn.running { background: #ef4444; }

  .start-row {
    display: flex;
    justify-content: center;
    padding: 0;
    margin-top: auto;
  }

  .visualizer {
    display: flex;
    gap: 6px;
    justify-content: center;
    height: 5px;
  }

  .beat-dot {
    flex: 1;
    max-width: 28px;
    height: 5px;
    border-radius: 3px;
    background: #2a2a2a;
    transition: background .1s;
  }

  .beat-dot.active { background: #22c55e; }

  @media (max-height: 680px) {
    .container { padding: 12px 18px 10px; }
    .bpm-value { font-size: 52px; }
    .bpm-btn { width: 36px; height: 36px; font-size: 18px; }
    .start-btn { width: 56px; height: 56px; font-size: 22px; }
    .beat-option { font-size: 11px; }
    .sound-option { padding: 4px 0; }
    .sounds-selector { margin-top: 6px; }
    .controls { margin-top: 6px; }
    .accent-row { margin-top: 4px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="bpm-display">
    <div class="bpm-value" id="bpmValue">120</div>
    <div class="bpm-label">BPM</div>
  </div>

  <div class="bpm-slider-wrap">
    <input type="range" id="bpmSlider" min="20" max="280" value="120">
  </div>

  <div class="bpm-actions">
    <button class="bpm-btn" id="bpmDown">−</button>
    <button class="bpm-btn" id="bpmUp">+</button>
  </div>

  <div class="sounds-selector">
    <label>Звук</label>
    <div class="sounds-grid" id="soundsGrid"></div>
  </div>

  <div class="accent-row">
    <label class="accent-toggle">
      <input type="checkbox" id="accentCheck" checked>
      <span class="accent-slider"></span>
      <span class="accent-label">Акцент на первый удар</span>
    </label>
  </div>

  <div class="controls">
    <div class="beats-selector">
      <label>Размер</label>
      <div class="beats-grid" id="beatsGrid"></div>
    </div>
  </div>

  <div class="visualizer" id="visualizer"></div>

  <div class="start-row">
    <button class="start-btn" id="startBtn">▶</button>
  </div>
</div>

<script>
  const bpmValue    = document.getElementById('bpmValue');
  const bpmSlider   = document.getElementById('bpmSlider');
  const bpmDown     = document.getElementById('bpmDown');
  const bpmUp       = document.getElementById('bpmUp');
  const beatsGrid   = document.getElementById('beatsGrid');
  const soundsGrid  = document.getElementById('soundsGrid');
  const startBtn    = document.getElementById('startBtn');
  const visualizer  = document.getElementById('visualizer');

  let audioCtx = null;
  let isRunning = false;
  let nextTickTime = 0;
  let timerId = null;
  let currentBeat = 0;

  function getBpm() { return parseInt(bpmSlider.value, 10); }
  function getBeats() { return parseInt(document.querySelector('.beat-option.active').dataset.value, 10); }
  function getSound() { return document.querySelector('.sound-option.active').dataset.value; }

  function updateBpmDisplay() {
    const bpm = getBpm();
    bpmValue.textContent = bpm;
    bpmValue.classList.toggle('running', isRunning);
  }

  function buildBeatsGrid(val = 4) {
    beatsGrid.innerHTML = '';
    for (let i = 1; i <= 10; i++) {
      const btn = document.createElement('button');
      btn.className = 'beat-option' + (i === val ? ' active' : '');
      btn.textContent = i;
      btn.dataset.value = i;
      btn.addEventListener('click', () => {
        if (btn.classList.contains('active')) return;
        beatsGrid.querySelector('.active').classList.remove('active');
        btn.classList.add('active');
        rebuildDots();
        if (isRunning) restartMetronome();
      });
      beatsGrid.appendChild(btn);
    }
  }

  function buildSoundsGrid(val = 'tick') {
    const sounds = [
      { value: 'tick', label: 'Тик' },
      { value: 'hat', label: 'Хэт' },
      { value: 'clack', label: 'Клак' },
      { value: 'kick', label: 'Бочка' },
      { value: 'snare', label: 'Snare' },
      { value: 'clap', label: 'Clap' },
    ];
    soundsGrid.innerHTML = '';
    for (const s of sounds) {
      const btn = document.createElement('button');
      btn.className = 'sound-option' + (s.value === val ? ' active' : '');
      btn.textContent = s.label;
      btn.dataset.value = s.value;
      btn.addEventListener('click', () => {
        if (btn.classList.contains('active')) return;
        soundsGrid.querySelector('.active').classList.remove('active');
        btn.classList.add('active');
        if (isRunning) restartMetronome();
      });
      soundsGrid.appendChild(btn);
    }
  }

  function rebuildDots() {
    const beats = getBeats();
    visualizer.innerHTML = '';
    for (let i = 0; i < beats; i++) {
      const dot = document.createElement('div');
      dot.className = 'beat-dot' + (i === 0 ? ' accent' : '');
      visualizer.appendChild(dot);
    }
  }

  function tapTick(beat) {
    const dots = visualizer.querySelectorAll('.beat-dot');
    dots.forEach((d, i) => {
      d.classList.toggle('active', i === beat);
    });
  }

  function createAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playNoise(beat, time, dur) {
    const accent = beat === 0;
    const sr = audioCtx.sampleRate;
    const len = Math.max(1, Math.floor(sr * dur));
    const buf = audioCtx.createBuffer(1, len, sr);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    const src = audioCtx.createBufferSource();
    src.buffer = buf;

    const bp = audioCtx.createBiquadFilter();
    bp.type = 'highpass';
    bp.frequency.value = accent ? 9000 : 7000;

    const gain = audioCtx.createGain();
    const vol = accent ? 0.4 : 0.25;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(vol, time + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

    src.connect(bp);
    bp.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(time);
    src.stop(time + dur);
  }

  function playClack(beat, time) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.frequency.value = beat === 0 ? 1400 : 1100;
    osc.type = 'triangle';

    const dur = 60 / getBpm() / 3;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(0.4, time + 0.001);
    gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

    osc.start(time);
    osc.stop(time + dur);
  }

  function playTick(beat, time) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.frequency.value = beat === 0 ? 1000 : 800;
    osc.type = 'sine';

    const dur = 60 / getBpm() / 2;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(0.35, time + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

    osc.start(time);
    osc.stop(time + dur);
  }

  function playKick(beat, time) {
    const accent = beat === 0;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.type = 'sine';
    osc.frequency.setValueAtTime(accent ? 200 : 150, time);
    osc.frequency.exponentialRampToValueAtTime(accent ? 50 : 40, time + 0.1);

    const dur = 60 / getBpm() / 2;
    const vol = accent ? 0.7 : 0.5;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(vol, time + 0.003);
    gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

    osc.start(time);
    osc.stop(time + dur);
  }

  function playSnare(beat, time) {
    const accent = beat === 0;
    const dur = 60 / getBpm() / 3;

    const osc = audioCtx.createOscillator();
    const gainOsc = audioCtx.createGain();
    osc.connect(gainOsc);
    gainOsc.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.value = accent ? 280 : 240;
    const volOsc = accent ? 0.4 : 0.25;
    gainOsc.gain.setValueAtTime(0, time);
    gainOsc.gain.linearRampToValueAtTime(volOsc, time + 0.002);
    gainOsc.gain.exponentialRampToValueAtTime(0.001, time + dur);

    const sr = audioCtx.sampleRate;
    const len = Math.max(1, Math.floor(sr * dur));
    const buf = audioCtx.createBuffer(1, len, sr);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'highpass';
    bp.frequency.value = accent ? 3000 : 2000;
    const gainNoise = audioCtx.createGain();
    src.connect(bp);
    bp.connect(gainNoise);
    gainNoise.connect(audioCtx.destination);
    const volNoise = accent ? 0.35 : 0.2;
    gainNoise.gain.setValueAtTime(0, time);
    gainNoise.gain.linearRampToValueAtTime(volNoise, time + 0.002);
    gainNoise.gain.exponentialRampToValueAtTime(0.001, time + dur);

    osc.start(time);
    osc.stop(time + dur);
    src.start(time);
    src.stop(time + dur);
  }

  function playClap(beat, time) {
    const accent = beat === 0;
    const dur = 60 / getBpm() / 4;
    const sr = audioCtx.sampleRate;
    const layers = accent ? 5 : 3;
    const vol = accent ? 0.28 : 0.18;

    for (let j = 0; j < layers; j++) {
      const offset = j * (accent ? 0.006 : 0.008);
      const t = time + offset;
      const len = Math.max(1, Math.floor(sr * dur));
      const buf = audioCtx.createBuffer(1, len, sr);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const bp = audioCtx.createBiquadFilter();
      bp.type = 'lowpass';
      bp.frequency.value = accent ? 4000 : 3000;
      const gain = audioCtx.createGain();
      src.connect(bp);
      bp.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(vol, t + 0.001);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.start(t);
      src.stop(t + dur);
    }
  }

  function playClick(beat, time) {
    createAudioCtx();
    const sound = getSound();
    const accentOn = document.getElementById('accentCheck').checked;
    const b = accentOn ? beat : 1;
    if (sound === 'hat') playNoise(b, time, 60 / getBpm() / 3);
    else if (sound === 'clack') playClack(b, time);
    else if (sound === 'kick') playKick(b, time);
    else if (sound === 'snare') playSnare(b, time);
    else if (sound === 'clap') playClap(b, time);
    else playTick(b, time);
  }

  function scheduleTick() {
    if (!isRunning) return;

    const bpm = getBpm();
    const beats = getBeats();
    const interval = 60 / bpm;

    while (nextTickTime < audioCtx.currentTime + 0.1) {
      const beat = currentBeat % beats;
      playClick(beat, nextTickTime);

      if (beat === 0 && currentBeat > 0) {
        // sync visual on next frame
      }

      const scheduleAhead = nextTickTime;
      if (Math.abs(scheduleAhead - audioCtx.currentTime) < 0.05) {
        tapTick(beat);
      } else {
        const delay = (scheduleAhead - audioCtx.currentTime) * 1000;
        setTimeout(() => tapTick(beat), delay);
      }

      currentBeat++;
      nextTickTime += interval;
    }

    timerId = setTimeout(scheduleTick, 25);
  }

  function startMetronome() {
    createAudioCtx();
    if (isRunning) return;
    isRunning = true;
    currentBeat = 0;
    nextTickTime = audioCtx.currentTime + 0.05;
    startBtn.textContent = '⏹';
    startBtn.classList.add('running');
    bpmValue.classList.add('running');
    scheduleTick();
  }

  function stopMetronome() {
    isRunning = false;
    if (timerId) {
      clearTimeout(timerId);
      timerId = null;
    }
    startBtn.textContent = '▶';
    startBtn.classList.remove('running');
    bpmValue.classList.remove('running');
    visualizer.querySelectorAll('.beat-dot').forEach(d => d.classList.remove('active'));
  }

  function toggleMetronome() {
    if (isRunning) {
      stopMetronome();
    } else {
      startMetronome();
    }
  }

  function setBpm(val) {
    val = Math.round(Math.min(280, Math.max(20, val)));
    bpmSlider.value = val;
    updateBpmDisplay();
    if (isRunning) {
      restartMetronome();
    }
  }

  function restartMetronome() {
    stopMetronome();
    startMetronome();
  }

  bpmSlider.addEventListener('input', () => {
    updateBpmDisplay();
    if (isRunning) restartMetronome();
  });

  bpmDown.addEventListener('click', () => setBpm(getBpm() - 1));
  bpmUp.addEventListener('click', () => setBpm(getBpm() + 1));
  startBtn.addEventListener('click', toggleMetronome);

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); toggleMetronome(); }
  });

  buildBeatsGrid(4);
  buildSoundsGrid('tick');
  rebuildDots();
  updateBpmDisplay();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
